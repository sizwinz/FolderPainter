[package]
name = "folderpainter"
version = "0.2.0"
description = "Custom Folder Icons for Windows"
authors = ["FolderPainter Team"]
edition = "2024"

[lib]
name = "folderpainter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "ico"] }
dirs = "6"
windows = { version = "0.60", features = [
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Graphics_Dwm",
    "Win32_Security",
] }
ureq = { version = "3.5.0", features = ["json"] }
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
